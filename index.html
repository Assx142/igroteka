<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ИГРОТЕКА — магазин детских игрушек</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://unpkg.com/react-router-dom@6.26.0/umd/react-router-dom.production.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, sans-serif; background: #fafafa; color: #222; line-height: 1.5; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
    .header { background: #ff6b35; color: #fff; padding: 12px 0; position: sticky; top: 0; z-index: 100; }
    .header__inner { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
    .logo { font-size: 24px; font-weight: 700; }
    .nav { display: flex; gap: 20px; }
    .nav a:hover { opacity: .8; }
    .header__actions { display: flex; gap: 12px; align-items: center; }
    .search { padding: 8px 12px; border-radius: 20px; border: none; min-width: 220px; }
    .btn { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; background: #fff; color: #ff6b35; font-weight: 600; }
    .btn--primary { background: #ff6b35; color: #fff; }
    .btn--ghost { background: transparent; color: #fff; border: 1px solid #fff; }
    .hero { background: linear-gradient(135deg, #ffd166, #ff6b35); color: #fff; padding: 60px 0; text-align: center; }
    .hero h1 { font-size: 42px; margin-bottom: 12px; }
    .hero p { font-size: 18px; }
    .catalog { display: grid; grid-template-columns: 260px 1fr; gap: 24px; padding: 32px 0; }
    .filters { background: #fff; padding: 20px; border-radius: 12px; height: fit-content; }
    .filters h3 { margin-bottom: 12px; }
    .filter-group { margin-bottom: 16px; }
    .filter-group label { display: block; margin-bottom: 4px; font-size: 14px; }
    .filter-group input, .filter-group select { width: 100%; padding: 6px; border: 1px solid #ddd; border-radius: 4px; }
    .products { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .product-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: flex; flex-direction: column; transition: transform .2s; }
    .product-card:hover { transform: translateY(-4px); }
    .product-card__img { width: 100%; height: 180px; object-fit: cover; background: #f0f0f0; }
    .product-card__body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .product-card__title { font-size: 15px; margin-bottom: 8px; }
    .product-card__price { font-size: 18px; font-weight: 700; color: #ff6b35; margin-top: auto; }
    .product-page { display: grid; grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px 0; }
    .product-page__img { width: 100%; height: 400px; object-fit: cover; border-radius: 12px; background: #f0f0f0; }
    .product-page__info h1 { margin-bottom: 12px; }
    .product-page__price { font-size: 28px; color: #ff6b35; margin: 16px 0; }
    .cart { padding: 32px 0; }
    .cart-item { display: grid; grid-template-columns: 80px 1fr auto auto; gap: 16px; align-items: center; background: #fff; padding: 12px; margin-bottom: 8px; border-radius: 8px; }
    .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 6px; }
    .cart-summary { background: #fff; padding: 20px; border-radius: 12px; margin-top: 20px; text-align: right; }
    .cart-summary__total { font-size: 22px; font-weight: 700; margin: 12px 0; }
    .form { max-width: 420px; margin: 40px auto; background: #fff; padding: 24px; border-radius: 12px; }
    .form h2 { margin-bottom: 16px; }
    .form-field { margin-bottom: 14px; }
    .form-field label { display: block; margin-bottom: 4px; font-size: 14px; }
    .form-field input { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; }
    .form-field .error { color: #d33; font-size: 12px; margin-top: 2px; }
    .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: #fff; }
    .admin-table th, .admin-table td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
    .admin-table th { background: #f5f5f5; }
    .footer { background: #222; color: #ccc; padding: 32px 0; margin-top: 40px; }
    .footer__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
    .notfound { text-align: center; padding: 80px 0; }
    .notfound h1 { font-size: 80px; color: #ff6b35; }
    @media (max-width: 768px) {
      .catalog { grid-template-columns: 1fr; }
      .product-page { grid-template-columns: 1fr; }
      .nav { display: none; }
      .search { min-width: 140px; }
      .footer__grid { grid-template-columns: 1fr; }
      .cart-item { grid-template-columns: 60px 1fr; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;
    const { HashRouter, Routes, Route, Link, useParams, useNavigate, useSearchParams } = ReactRouterDOM;

    const productsData = [
      { id: 1, title: "Конструктор LEGO Classic 10696", category: "Конструкторы", brand: "LEGO", price: 2490, oldPrice: 2990, stock: 15, rating: 4.8, image: "https://images.unsplash.com/photo-1587654780291-39c9404d746b?w=400", description: "Классический набор из 484 деталей разных цветов. Развивает воображение и мелкую моторику.", age: "4-99" },
      { id: 2, title: "Развивающий коврик Tiny Love", category: "Для малышей", brand: "Tiny Love", price: 3590, stock: 8, rating: 4.9, image: "https://images.unsplash.com/photo-1515488042361-ee00e0ddd4e4?w=400", description: "Яркий коврик с дугами и подвесными игрушками для детей от 0 до 12 месяцев.", age: "0-1" },
      { id: 3, title: "Настольная игра Монополия Классическая", category: "Настольные игры", brand: "Hasbro", price: 1890, stock: 22, rating: 4.7, image: "https://images.unsplash.com/photo-1610890716171-6b1c9f2bd40c?w=400", description: "Легендарная экономическая игра для всей семьи. 2-6 игроков.", age: "8+" },
      { id: 4, title: "Кукла Barbie Модница", category: "Куклы", brand: "Mattel", price: 1290, stock: 30, rating: 4.5, image: "https://images.unsplash.com/photo-1558877385-8c1b8d0c9b1e?w=400", description: "Кукла в модном наряде с аксессуарами. Высота 30 см.", age: "3+" },
      { id: 5, title: "Машинка Hot Wheels трек", category: "Машинки", brand: "Hot Wheels", price: 2190, stock: 12, rating: 4.6, image: "https://images.unsplash.com/photo-1558618666-fcd25c85cd64?w=400", description: "Гоночный трек с петлёй и одной машинкой в комплекте.", age: "4+" },
      { id: 6, title: "Пазл Ravensburger 1000 деталей", category: "Пазлы", brand: "Ravensburger", price: 990, stock: 40, rating: 4.8, image: "https://images.unsplash.com/photo-1606081480183-26dae95dc28f?w=400", description: "Красочный пазл с изображением природы. Развивает усидчивость.", age: "10+" },
      { id: 7, title: "Мягкая игрушка Мишка Тедди", category: "Мягкие игрушки", brand: "Игрушкин", price: 790, stock: 50, rating: 4.9, image: "https://images.unsplash.com/photo-1559715541-5daf8a0296d0?w=400", description: "Плюшевый мишка 40 см. Гипоаллергенный наполнитель.", age: "0+" },
      { id: 8, title: "Набор для опытов Юный химик", category: "Развивающие", brand: "Steampunk", price: 1590, stock: 18, rating: 4.7, image: "https://images.unsplash.com/photo-1530053969600-caed2596d242?w=400", description: "20 безопасных опытов для детей. Инструкция на русском языке.", age: "8+" }
    ];

    const clientsData = [
      { id: 1, name: "Анна Смирнова", email: "anna@mail.ru", phone: "+7-900-111-22-33", address: "Москва, ул. Ленина, 10", password: "123456", role: "user" },
      { id: 2, name: "Администратор", email: "admin@igroteka.ru", phone: "+7-900-000-00-00", address: "Юрга, ул. Победы, 1", password: "admin", role: "admin" }
    ];

    const ordersData = [
      { id: 1001, clientId: 1, date: "2026-11-01", status: "completed", items: [{ productId: 1, quantity: 1, price: 2490 }, { productId: 7, quantity: 2, price: 790 }], total: 4070 },
      { id: 1002, clientId: 1, date: "2026-11-05", status: "pending", items: [{ productId: 3, quantity: 1, price: 1890 }], total: 1890 }
    ];

    const api = {
      products: { getAll: () => JSON.parse(localStorage.getItem('igroteka_products')) || productsData, save: (data) => localStorage.setItem('igroteka_products', JSON.stringify(data)) },
      clients: { getAll: () => JSON.parse(localStorage.getItem('igroteka_clients')) || clientsData, save: (data) => localStorage.setItem('igroteka_clients', JSON.stringify(data)) },
      orders: { getAll: () => JSON.parse(localStorage.getItem('igroteka_orders')) || ordersData, save: (data) => localStorage.setItem('igroteka_orders', JSON.stringify(data)) }
    };

    const CartContext = React.createContext();
    const AuthContext = React.createContext();

    function CartProvider({ children }) {
      const [items, setItems] = useState(() => JSON.parse(localStorage.getItem('igroteka_cart')) || []);
      useEffect(() => localStorage.setItem('igroteka_cart', JSON.stringify(items)), [items]);
      const add = (product, qty = 1) => { setItems(prev => { const existing = prev.find(i => i.productId === product.id); if (existing) return prev.map(i => i.productId === product.id ? { ...i, quantity: i.quantity + qty } : i); return [...prev, { productId: product.id, quantity: qty, price: product.price, title: product.title, image: product.image }]; }); };
      const remove = (productId) => setItems(prev => prev.filter(i => i.productId !== productId));
      const updateQty = (productId, qty) => { if (qty <= 0) return remove(productId); setItems(prev => prev.map(i => i.productId === productId ? { ...i, quantity: qty } : i)); };
      const clear = () => setItems([]);
      const total = items.reduce((s, i) => s + i.price * i.quantity, 0);
      const count = items.reduce((s, i) => s + i.quantity, 0);
      return <CartContext.Provider value={{ items, add, remove, updateQty, clear, total, count }}>{children}</CartContext.Provider>;
    }

    function AuthProvider({ children }) {
      const [user, setUser] = useState(() => JSON.parse(localStorage.getItem('igroteka_user')));
      useEffect(() => { if (user) localStorage.setItem('igroteka_user', JSON.stringify(user)); else localStorage.removeItem('igroteka_user'); }, [user]);
      const login = (email, password) => { const clients = api.clients.getAll(); const found = clients.find(c => c.email === email && c.password === password); if (found) { setUser(found); return { ok: true }; } return { ok: false, error: 'Неверный email или пароль' }; };
      const register = (name, email, phone, address, password) => { const clients = api.clients.getAll(); if (clients.find(c => c.email === email)) return { ok: false, error: 'Пользователь уже существует' }; const newUser = { id: Math.max(0, ...clients.map(c => c.id)) + 1, name, email, phone, address, password, role: 'user' }; api.clients.save([...clients, newUser]); setUser(newUser); return { ok: true }; };
      const logout = () => setUser(null);
      return <AuthContext.Provider value={{ user, login, register, logout }}>{children}</AuthContext.Provider>;
    }

    function Header() {
      const { count } = React.useContext(CartContext);
      const { user, logout } = React.useContext(AuthContext);
      const [q, setQ] = useState('');
      const nav = useNavigate();
      const onSearch = (e) => { e.preventDefault(); if (q.trim()) nav(`/catalog?search=${encodeURIComponent(q)}`); };
      return (<header className="header"><div className="container header__inner"><Link to="/" className="logo">🧸 ИГРОТЕКА</Link><nav className="nav"><Link to="/">Главная</Link><Link to="/catalog">Каталог</Link>{user?.role === 'admin' && <Link to="/admin/products">Админ</Link>}</nav><form onSubmit={onSearch} style={{display:'flex'}}><input className="search" placeholder="Поиск игрушек..." value={q} onChange={e => setQ(e.target.value)} /></form><div className="header__actions"><Link to="/cart" className="btn">🛒 {count}</Link>{user ? (<><Link to="/profile" className="btn--ghost btn">{user.name.split(' ')[0]}</Link><button className="btn--ghost btn" onClick={logout}>Выйти</button></>) : (<Link to="/login" className="btn--ghost btn">Войти</Link>)}</div></div></header>);
    }

    function Footer() {
      return (<footer className="footer"><div className="container footer__grid"><div><h3>🧸 ИГРОТЕКА</h3><p>Магазин детских игрушек и развивающих игр с доставкой по России.</p></div><div><h4>Контакты</h4><p>📞 8-800-555-35-35</p><p>✉️ info@igroteka.ru</p><p>📍 г. Юрга, ул. Победы, 1</p></div><div><h4>Покупателям</h4><p>Доставка и оплата</p><p>Возврат товара</p><p>Гарантия</p></div></div></footer>);
    }

    function Layout() {
      return (<><Header /><main><Routes><Route path="/" element={<Home />} /><Route path="/catalog" element={<Catalog />} /><Route path="/product/:id" element={<Product />} /><Route path="/cart" element={<Cart />} /><Route path="/checkout" element={<Checkout />} /><Route path="/login" element={<Login />} /><Route path="/register" element={<Register />} /><Route path="/profile" element={<Profile />} /><Route path="/admin/products" element={<AdminProducts />} /><Route path="/admin/orders" element={<AdminOrders />} /><Route path="*" element={<NotFound />} /></Routes></main><Footer /></>);
    }

    function ProductCard({ product }) {
      const { add } = React.useContext(CartContext);
      return (<div className="product-card"><Link to={`/product/${product.id}`}><img className="product-card__img" src={product.image} alt={product.title} /></Link><div className="product-card__body"><Link to={`/product/${product.id}`}><h3 className="product-card__title">{product.title}</h3></Link><div style={{fontSize:13,color:'#888',marginBottom:8}}>⭐ {product.rating} · {product.brand}</div><div className="product-card__price">{product.price} ₽</div><button className="btn btn--primary" style={{marginTop:10}} onClick={() => add(product)}>В корзину</button></div></div>);
    }

    function Home() {
      const [products, setProducts] = useState([]);
      useEffect(() => setProducts(api.products.getAll()), []);
      const popular = [...products].sort((a,b) => b.rating - a.rating).slice(0,4);
      const newItems = products.slice(0,4);
      return (<><section className="hero"><div className="container"><h1>Игрушки, которые развивают!</h1><p>Более 1000 товаров для детей от 0 до 14 лет</p><Link to="/catalog" className="btn btn--primary" style={{marginTop:20,display:'inline-block'}}>Перейти в каталог</Link></div></section><section className="container" style={{padding:'40px 16px'}}><h2 style={{marginBottom:20}}>🔥 Популярное</h2><div className="products">{popular.map(p => <ProductCard key={p.id} product={p} />)}</div></section><section className="container" style={{padding:'0 16px 40px'}}><h2 style={{marginBottom:20}}>🆕 Новинки</h2><div className="products">{newItems.map(p => <ProductCard key={p.id} product={p} />)}</div></section></>);
    }

    function Catalog() {
      const [products, setProducts] = useState([]);
      const [params] = useSearchParams();
      const [priceMax, setPriceMax] = useState(5000);
      const [category, setCategory] = useState('');
      const [sort, setSort] = useState('popular');
      useEffect(() => setProducts(api.products.getAll()), []);
      const categories = useMemo(() => [...new Set(products.map(p => p.category))], [products]);
      const filtered = useMemo(() => { let list = [...products]; const search = params.get('search')?.toLowerCase(); if (search) list = list.filter(p => p.title.toLowerCase().includes(search)); if (category) list = list.filter(p => p.category === category); list = list.filter(p => p.price <= priceMax); if (sort === 'price_asc') list.sort((a,b) => a.price - b.price); if (sort === 'price_desc') list.sort((a,b) => b.price - a.price); if (sort === 'rating') list.sort((a,b) => b.rating - a.rating); return list; }, [products, params, category, priceMax, sort]);
      return (<div className="container catalog"><aside className="filters"><h3>Фильтры</h3><div className="filter-group"><label>Категория</label><select value={category} onChange={e => setCategory(e.target.value)}><option value="">Все</option>{categories.map(c => <option key={c}>{c}</option>)}</select></div><div className="filter-group"><label>Цена до: {priceMax} ₽</label><input type="range" min="100" max="5000" step="100" value={priceMax} onChange={e => setPriceMax(+e.target.value)} /></div><div className="filter-group"><label>Сортировка</label><select value={sort} onChange={e => setSort(e.target.value)}><option value="popular">По популярности</option><option value="price_asc">Сначала дешёвые</option><option value="price_desc">Сначала дорогие</option><option value="rating">По рейтингу</option></select></div><button className="btn" onClick={() => {setCategory('');setPriceMax(5000);setSort('popular')}}>Сбросить</button></aside><div><h2 style={{marginBottom:20}}>Каталог ({filtered.length})</h2><div className="products">{filtered.map(p => <ProductCard key={p.id} product={p} />)}{filtered.length === 0 && <p>Ничего не найдено</p>}</div></div></div>);
    }

    function Product() {
      const { id } = useParams();
      const [product, setProduct] = useState(null);
      const [qty, setQty] = useState(1);
      const { add } = React.useContext(CartContext);
      useEffect(() => { const p = api.products.getAll().find(p => p.id === +id); setProduct(p); }, [id]);
      if (!product) return <div className="container notfound"><h1>Товар не найден</h1><Link to="/catalog" className="btn btn--primary">В каталог</Link></div>;
      return (<div className="container product-page"><img className="product-page__img" src={product.image} alt={product.title} /><div className="product-page__info"><h1>{product.title}</h1><div style={{color:'#888'}}>Артикул: {product.id} · {product.brand}</div><div className="product-page__price">{product.price} ₽</div><p style={{margin:'16px 0'}}>{product.description}</p><p><b>Категория:</b> {product.category}</p><p><b>Возраст:</b> {product.age}</p><p><b>В наличии:</b> {product.stock} шт.</p><p><b>Рейтинг:</b> ⭐ {product.rating}</p><div style={{display:'flex',gap:10,marginTop:20,alignItems:'center'}}><input type="number" min="1" max={product.stock} value={qty} onChange={e => setQty(+e.target.value)} style={{width:70,padding:8}} /><button className="btn btn--primary" onClick={() => add(product, qty)}>В корзину</button></div></div></div>);
    }

    function Cart() {
      const { items, updateQty, remove, total, clear } = React.useContext(CartContext);
      if (items.length === 0) return <div className="container notfound"><h1>Корзина пуста</h1><Link to="/catalog" className="btn btn--primary">Перейти в каталог</Link></div>;
      return (<div className="container cart"><h1>Корзина</h1>{items.map(i => (<div className="cart-item" key={i.productId}><img src={i.image} alt={i.title} /><div><div><b>{i.title}</b></div><div>{i.price} ₽</div></div><div><button onClick={() => updateQty(i.productId, i.quantity-1)}>-</button><span style={{margin:'0 8px'}}>{i.quantity}</span><button onClick={() => updateQty(i.productId, i.quantity+1)}>+</button></div><div><b>{i.price * i.quantity} ₽</b><button onClick={() => remove(i.productId)} style={{marginLeft:10,color:'#d33'}}>✕</button></div></div>))}<div className="cart-summary"><div>Итого: <span className="cart-summary__total">{total} ₽</span></div><div style={{display:'flex',gap:10,justifyContent:'flex-end'}}><button className="btn" onClick={clear}>Очистить</button><Link to="/checkout" className="btn btn--primary">Оформить заказ</Link></div></div></div>);
    }

    function Checkout() {
      const { items, total, clear } = React.useContext(CartContext);
      const { user } = React.useContext(AuthContext);
      const nav = useNavigate();
      const [form, setForm] = useState({ name: user?.name || '', phone: user?.phone || '', address: user?.address || '', delivery: 'courier', payment: 'card' });
      const [error, setError] = useState('');
      const submit = (e) => { e.preventDefault(); if (!form.name || !form.phone || !form.address) { setError('Заполните все поля'); return; } const orders = api.orders.getAll(); const newOrder = { id: Math.max(0, ...orders.map(o => o.id)) + 1, clientId: user?.id || 0, date: new Date().toISOString().slice(0,10), status: 'pending', items: items.map(i => ({ productId: i.productId, quantity: i.quantity, price: i.price })), total }; api.orders.save([...orders, newOrder]); clear(); alert(`Заказ №${newOrder.id} оформлен!`); nav('/profile'); };
      return (<div className="container" style={{padding:'32px 16px'}}><h1>Оформление заказа</h1><form className="form" onSubmit={submit} style={{maxWidth:600}}><div className="form-field"><label>ФИО</label><input value={form.name} onChange={e=>setForm({...form,name:e.target.value})}/></div><div className="form-field"><label>Телефон</label><input value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})}/></div><div className="form-field"><label>Адрес</label><input value={form.address} onChange={e=>setForm({...form,address:e.target.value})}/></div><div className="form-field"><label>Доставка</label><select value={form.delivery} onChange={e=>setForm({...form,delivery:e.target.value})}><option value="courier">Курьер</option><option value="pickup">Самовывоз</option><option value="post">Почта</option></select></div><div className="form-field"><label>Оплата</label><select value={form.payment} onChange={e=>setForm({...form,payment:e.target.value})}><option value="card">Картой</option><option value="sbp">СБП</option><option value="cash">При получении</option></select></div><div style={{fontSize:18,margin:'16px 0'}}><b>Итого: {total} ₽</b></div>{error && <div className="error">{error}</div>}<button className="btn btn--primary" style={{width:'100%'}}>Подтвердить заказ</button></form></div>);
    }

    function Login() {
      const [email, setEmail] = useState('');
      const [password, setPassword] = useState('');
      const [error, setError] = useState('');
      const { login } = React.useContext(AuthContext);
      const nav = useNavigate();
      const submit = (e) => { e.preventDefault(); const res = login(email, password); if (res.ok) nav('/profile'); else setError(res.error); };
      return (<form className="form" onSubmit={submit}><h2>Вход</h2><div className="form-field"><label>Email</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} required/></div><div className="form-field"><label>Пароль</label><input type="password" value={password} onChange={e=>setPassword(e.target.value)} required/></div>{error && <div className="error">{error}</div>}<button className="btn btn--primary" style={{width:'100%'}}>Войти</button><p style={{marginTop:12,textAlign:'center'}}>Нет аккаунта? <Link to="/register" style={{color:'#ff6b35'}}>Регистрация</Link></p></form>);
    }

    function Register() {
      const [f, setF] = useState({name:'',email:'',phone:'',address:'',password:''});
      const [error, setError] = useState('');
      const { register } = React.useContext(AuthContext);
      const nav = useNavigate();
      const submit = (e) => { e.preventDefault(); if (f.password.length < 6) { setError('Пароль минимум 6 символов'); return; } const res = register(f.name, f.email, f.phone, f.address, f.password); if (res.ok) nav('/profile'); else setError(res.error); };
      return (<form className="form" onSubmit={submit}><h2>Регистрация</h2>{['name','email','phone','address'].map(k => (<div className="form-field" key={k}><label>{k==='name'?'ФИО':k==='email'?'Email':k==='phone'?'Телефон':'Адрес'}</label><input value={f[k]} onChange={e=>setF({...f,[k]:e.target.value})} required/></div>))}<div className="form-field"><label>Пароль</label><input type="password" value={f.password} onChange={e=>setF({...f,password:e.target.value})} required/></div>{error && <div className="error">{error}</div>}<button className="btn btn--primary" style={{width:'100%'}}>Зарегистрироваться</button><p style={{marginTop:12,textAlign:'center'}}>Есть аккаунт? <Link to="/login" style={{color:'#ff6b35'}}>Войти</Link></p></form>);
    }

    function Profile() {
      const { user } = React.useContext(AuthContext);
      const [orders, setOrders] = useState([]);
      useEffect(() => { setOrders(api.orders.getAll().filter(o => o.clientId === user.id)); }, [user]);
      return (<div className="container" style={{padding:'32px 16px'}}><h1>Личный кабинет</h1><div style={{background:'#fff',padding:20,borderRadius:12,marginBottom:20}}><p><b>ФИО:</b> {user.name}</p><p><b>Email:</b> {user.email}</p><p><b>Телефон:</b> {user.phone}</p><p><b>Адрес:</b> {user.address}</p></div><h2>История заказов</h2>{orders.length === 0 && <p>Заказов пока нет</p>}<table className="admin-table"><thead><tr><th>№</th><th>Дата</th><th>Сумма</th><th>Статус</th></tr></thead><tbody>{orders.map(o => (<tr key={o.id}><td>{o.id}</td><td>{o.date}</td><td>{o.total} ₽</td><td>{o.status === 'completed' ? '✅ Доставлен' : o.status === 'pending' ? '⏳ В обработке' : o.status}</td></tr>))}</tbody></table></div>);
    }

    function AdminProducts() {
      const [products, setProducts] = useState([]);
      const [edit, setEdit] = useState(null);
      useEffect(() => setProducts(api.products.getAll()), []);
      const save = () => { const updated = products.map(p => p.id === edit.id ? edit : p); api.products.save(updated); setProducts(updated); setEdit(null); };
      const del = (id) => { if (!confirm('Удалить?')) return; const updated = products.filter(p => p.id !== id); api.products.save(updated); setProducts(updated); };
      return (<div className="container" style={{padding:'32px 16px'}}><h1>Админ-панель: Товары</h1><table className="admin-table"><thead><tr><th>ID</th><th>Название</th><th>Цена</th><th>Остаток</th><th>Действия</th></tr></thead><tbody>{products.map(p => (<tr key={p.id}><td>{p.id}</td><td>{p.title}</td><td>{p.price} ₽</td><td>{p.stock}</td><td><button className="btn" onClick={() => setEdit(p)}>Ред.</button><button className="btn" style={{color:'#d33',marginLeft:8}} onClick={() => del(p.id)}>Уд.</button></td></tr>))}</tbody></table>{edit && (<div style={{position:'fixed',inset:0,background:'rgba(0,0,0,.5)',display:'flex',alignItems:'center',justifyContent:'center'}}><div style={{background:'#fff',padding:24,borderRadius:12,minWidth:400}}><h3>Редактировать товар</h3><div className="form-field"><label>Название</label><input value={edit.title} onChange={e=>setEdit({...edit,title:e.target.value})}/></div><div className="form-field"><label>Цена</label><input type="number" value={edit.price} onChange={e=>setEdit({...edit,price:+e.target.value})}/></div><div className="form-field"><label>Остаток</label><input type="number" value={edit.stock} onChange={e=>setEdit({...edit,stock:+e.target.value})}/></div><div style={{display:'flex',gap:10}}><button className="btn btn--primary" onClick={save}>Сохранить</button><button className="btn" onClick={() => setEdit(null)}>Отмена</button></div></div></div>)}</div>);
    }

    function AdminOrders() {
      const [orders, setOrders] = useState([]);
      useEffect(() => setOrders(api.orders.getAll()), []);
      const setStatus = (id, status) => { const updated = orders.map(o => o.id === id ? {...o, status} : o); api.orders.save(updated); setOrders(updated); };
      return (<div className="container" style={{padding:'32px 16px'}}><h1>Админ-панель: Заказы</h1><table className="admin-table"><thead><tr><th>№</th><th>Дата</th><th>Клиент ID</th><th>Сумма</th><th>Статус</th><th>Действие</th></tr></thead><tbody>{orders.map(o => (<tr key={o.id}><td>{o.id}</td><td>{o.date}</td><td>{o.clientId}</td><td>{o.total} ₽</td><td>{o.status}</td><td><select value={o.status} onChange={e => setStatus(o.id, e.target.value)}><option value="pending">В обработке</option><option value="confirmed">Подтверждён</option><option value="shipped">Отправлен</option><option value="completed">Доставлен</option><option value="cancelled">Отменён</option></select></td></tr>))}</tbody></table></div>);
    }

    function NotFound() {
      return (<div className="container notfound"><h1>404</h1><p>Страница не найдена</p><Link to="/" className="btn btn--primary" style={{marginTop:20,display:'inline-block'}}>На главную</Link></div>);
    }

    function App() {
      return (<AuthProvider><CartProvider><HashRouter><Layout /></HashRouter></CartProvider></AuthProvider>);
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
